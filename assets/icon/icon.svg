<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D7CCC8"/>
      <stop offset="100%" style="stop-color:#BCAAA4"/>
    </linearGradient>
    <linearGradient id="pot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8D6E63"/>
      <stop offset="100%" style="stop-color:#6D4C41"/>
    </linearGradient>
    <linearGradient id="steam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#A1887F;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#D7CCC8;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Steam wisps -->
  <path d="M190 200 Q195 170 185 145 Q178 125 188 105" stroke="url(#steam)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M256 185 Q261 155 251 130 Q244 110 254 90" stroke="url(#steam)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M322 200 Q327 170 317 145 Q310 125 320 105" stroke="url(#steam)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Pot body -->
  <ellipse cx="256" cy="310" rx="140" ry="28" fill="#5D4037"/>
  <rect x="116" y="240" width="280" height="72" rx="8" fill="url(#pot)"/>
  <ellipse cx="256" cy="240" rx="140" ry="28" fill="#8D6E63"/>
  <!-- Pot rim -->
  <ellipse cx="256" cy="240" rx="150" ry="22" fill="#6D4C41"/>
  <ellipse cx="256" cy="237" rx="150" ry="22" fill="#8D6E63"/>
  <!-- Pot handles -->
  <path d="M116 260 Q80 260 80 280 Q80 300 116 300" stroke="#6D4C41" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M396 260 Q432 260 432 280 Q432 300 396 300" stroke="#6D4037" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- Dice (lottery element) -->
  <g transform="translate(340, 350) rotate(15)">
    <rect x="0" y="0" width="72" height="72" rx="14" fill="#FFB74D"/>
    <rect x="3" y="3" width="66" height="66" rx="12" fill="#FFCC80"/>
    <!-- Dice dots -->
    <circle cx="20" cy="20" r="6" fill="#6D4C41"/>
    <circle cx="52" cy="20" r="6" fill="#6D4C41"/>
    <circle cx="36" cy="36" r="6" fill="#6D4C41"/>
    <circle cx="20" cy="52" r="6" fill="#6D4C41"/>
    <circle cx="52" cy="52" r="6" fill="#6D4C41"/>
  </g>
  <!-- Small heart -->
  <g transform="translate(120, 370) scale(0.7)">
    <path d="M20 35 Q20 20 30 15 Q40 10 40 22 Q40 35 20 55 Q0 35 0 22 Q0 10 10 15 Q20 20 20 35Z" fill="#E57373" opacity="0.8"/>
  </g>
</svg>
